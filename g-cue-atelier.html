<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>G-CUE ATELIER Engine</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }
        body {
            background-color: #050505 !important; 
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            overflow: hidden;
        }
        main {
            width: 100%; 
            max-width: 380px; 
            height: 680px; 
            background-color: #0D0D0D !important;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 28px; 
            padding: 24px;
            display: flex; 
            flex-direction: column; 
            position: relative; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }
        .screen { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
        }
        .screen.active { 
            display: flex !important; 
        }
        h1 { 
            font-size: 22px; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            color: #D4AF37 !important; 
            text-align: center; 
            margin-bottom: 4px; 
            font-weight: 300; 
        }
        .subtitle { 
            font-size: 9px; 
            color: #666666 !important; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 30px; 
        }
        .quote { 
            font-size: 11px; 
            color: #888888 !important; 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 0 10px; 
            line-height: 1.4;
            min-height: 32px;
        }
        .login-box { 
            border: 1px solid rgba(255,255,255,0.06); 
            background-color: #111111 !important; 
            padding: 30px 20px; 
            border-radius: 166px; 
            margin: auto 0; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .input-group label { 
            font-size: 10px; 
            color: #888888 !important; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
        }
        .input-field { 
            width: 100%; 
            background-color: #161616 !important; 
            border: 1px solid rgba(255,255,255,0.12); 
            border-radius: 8px; 
            padding: 14px; 
            color: #ffffff !important; 
            font-family: monospace; 
            font-size: 14px; 
            outline: none; 
        }
        #spatial-viewport { 
            width: 100%; 
            height: 260px; 
            background-color: #141414 !important; 
            border-radius: 20px; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.08); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        #spatial-viewport svg {
            width: 50%;
            height: 50%;
            transition: transform 0.3s ease;
        }
